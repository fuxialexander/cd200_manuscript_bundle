[project]
name = "cd200-mutation-manuscript-bundle"
version = "0.1.0"
description = "Minimal CD200 mutation analysis and checkpoint training bundle"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.10.8",
    "numba>=0.65.0",
    "numpy<=2.2",
    "openpyxl>=3.1.5",
    "pandas>=2.3.1",
    "pillow>=11.0.0",
    "pybigwig>=0.3.24",
    "pyliftover>=0.4.1",
    "pyranges>=0.1.4",
    "pytorch-lightning>=2.5.2",
    "pyyaml>=6.0.0",
    "requests>=2.32.4",
    "scipy>=1.16.0",
    "torch>=2.7.1",
    "tqdm>=4.67.1",
    "wandb>=0.21.0",
    "zarr>=3.0.0,<4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "src/mutation_analysis",
    "src/atac_prediction",
    "src/atac_diff_prediction",
    "model_studio",
]
