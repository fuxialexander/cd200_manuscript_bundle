[project]
name = "cd200-mutation-manuscript-bundle"
version = "0.2.2"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Xi Fu"}, {name = "Anqi Shao"}]
description = "Minimal CD200 mutation analysis and checkpoint training bundle"
requires-python = ">=3.12,<3.13"
dependencies = [
    "cython",
    "pysam",
    "gcell @ git+https://github.com/fuxialexander/gcell@6b1ceade26046901f1c126c61691c8b9400316a0",
    "intervaltree",
    "omegaconf",
    "hydra-core",
    "scanpy[leiden]>=1.10.0,<1.12.0",
    "einops>=0.8.1",
    "fastcluster>=1.3.0",
    "pywavelets>=1.8.0",
    "ffq>=0.3.1",
    "scikit-learn>=1.0.0",
    "scikit-misc>=0.3.0",

    "matplotlib>=3.10.8",
    "numba>=0.65.0",
    "numpy<=2.2",
    "openpyxl>=3.1.5",
    "pandas>=2.3.1",
    "pillow>=11.0.0",
    "pybigwig>=0.3.24",
    "pyliftover>=0.4.1",
    "pyranges>=0.1.4",
    "pytorch-lightning>=2.5.2",
    "pyyaml>=6.0.0",
    "requests>=2.32.4",
    "scipy>=1.16.0",
    "torch>=2.7.1",
    "tqdm>=4.67.1",
    "wandb>=0.21.0",
    "zarr>=3.0.0,<4",
]

[project.scripts]
cd200-modl = "cd200_bundle_resources:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "src/mutation_analysis",
    "src/atac_prediction",
    "src/atac_diff_prediction",
    "model_studio",
    "configs",
    "vendor/caesarion/src/caesar",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel.force-include]
"src/checkpoint_manager.py" = "checkpoint_manager.py"
"src/checkpoint_utils.py" = "checkpoint_utils.py"
"src/utils.py" = "utils.py"
"packaging/cd200_bundle_resources" = "cd200_bundle_resources"
"src" = "cd200_bundle_resources/src"
"scripts" = "cd200_bundle_resources/scripts"
"model_studio" = "cd200_bundle_resources/model_studio"
"artifacts" = "cd200_bundle_resources/artifacts"
"configs" = "cd200_bundle_resources/configs"
